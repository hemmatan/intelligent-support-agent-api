repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Run the project's own pinned mypy rather than an isolated environment,
  # which would lack the third-party stubs and report spurious import errors.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Type checks the whole project, so it must name its own target and
        # run even when the staged changes are configuration rather than code.
        entry: mypy .
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
