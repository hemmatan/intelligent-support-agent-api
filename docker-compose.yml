x-app: &app
  build:
    context: .
    target: runtime
  image: dornashop-support:local
  volumes:
    - .:/app:ro
    - sqlite_data:/var/lib/dornashop

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  sqlite_data:
