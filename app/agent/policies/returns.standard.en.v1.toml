id = "returns.standard"
locale = "en"
version = 1
approved = true
kind = "return_policy"

prose_template = """
You can return {eligibility} within {return_window_days} days of delivery for a
full refund. Items must be unworn, in their original packaging, and sent back
with proof of purchase. We do not accept returns of {excluded_categories} for
hygiene reasons. Sale items follow the same {return_window_days} days unless
they are marked final sale.
"""

[claims]
return_window_days = 30
eligibility = "standard_items"
excluded_categories = ["underwear", "swimwear", "pierced_jewellery"]
final_sale_returnable = false
proof_of_purchase_required = true

[words]
standard_items = "most items"
underwear = "underwear"
swimwear = "swimwear"
pierced_jewellery = "pierced jewellery"
